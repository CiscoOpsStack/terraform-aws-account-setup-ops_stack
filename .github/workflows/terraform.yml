name: terraform module
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"

jobs:
  TERRAFORM_MODULE:
    uses: CiscoOpsStack/ops_stack_github_actions/.github/workflows/terraform_module.yml@main
    secrets:
      GH_PAT_TOKEN: ${{ secrets.GH_PAT_READ_TOKEN }}
      OPS_STACK_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OPS_STACK_GITHUB_APP_PRIVATE_KEY }}
    with:
      TF_VERSION: 1.9.8
      checkout_ref: ${{ github.head_ref || github.ref_name }}
      caller_event_name: ${{ github.event_name }}
      pr_head_branch: ${{ github.head_ref || github.ref_name }}
      run_ruff: false
      run_lambda_ci: false
